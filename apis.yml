description: Valiant Networks, Inc. was a dot-com-era network testing, design, and consulting
  firm serving carriers and network equipment vendors, raising a $21M Series B in October
  1999 and cutting staff (including its CEO) in the 2001 telecom downturn per Light Reading.
  It appears on Battery Ventures' list of all portfolio companies. The company is defunct
  with no surviving web presence or API surface; valiantnetworks.com lapsed and was later
  re-registered (2004) by unrelated businesses, and today does not resolve.
